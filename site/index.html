<script>
  // Set the theme before first paint (avoids a flash). Uses the saved choice,
  // falling back to the OS preference on first visit.
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  })();
</script>
<script src="marked.min.js"></script>
<style>
  :root {

    --color-on-primary: #FFFFFF;
    --color-primary-container: #D3E3FD;

    --color-secondary-container: #C1E7FF;

    --color-tertiary: #146C2E;
    --color-on-tertiary: #FFFFFF;
    --color-tertiary-container: #C4EED1;
    --color-on-tertiary-container: #125223;
    --color-error: #B3261E;
    --color-on-error: #FFFFFF;
    --color-error-container: #F9DEDC;
    --color-on-error-container: #8C1D18;
    --color-background: #FFFFFF;
    --color-on-background: #1F1F1F;
    --color-surface: #FFFFFF;
    --color-on-surface: #1F1F1F;
    --color-surface-variant: #E0E3E1;
    --color-on-surface-variant: #444746;
    --color-outline: #747775;
    --color-outline-variant: #C4C7C5;
    --color-inverse-surface: #303030;
    --color-inverse-on-surface: #F2F2F2;
    --color-inverse-primary: #A9C7FB;
    --color-surface-dim: #D4DBE4;
    --color-surface-bright: #FFFFFF;
    --color-surface-container-lowest: #FFFFFF;
    --color-surface-container-low: #F9FAFD;
    --color-surface-container: #F0F4F9;
    --color-surface-container-high: #E8EEF6;
    --color-surface-container-highest: #DDE3E9;
    --color-selection-background: #cae5ff;

    --google-yellow: #FBBC04;

    --shadow-elevation-2: 0px 1px 2px 0px rgba(0,0,0,0.3), 0px 2px 6px 2px rgba(0,0,0,0.15);

    /* Shape scale (M3) */
    --radius-xs: 4px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 28px;

    /* Code block surfaces (kept dark in both themes, per original design) */

    --code-fg: #E8EAED;

    /* --- Legacy aliases mapped onto M3 roles (keeps existing rules working) --- */
    --bg: var(--color-background);
    --surface: var(--color-surface);
    --border: var(--color-outline-variant);
    --text: var(--color-on-surface);
    --text-muted: var(--color-on-surface-variant);
    --accent: var(--color-primary);

<script type="text/markdown" id="md-inline"></script>
<script>
  const MD_PATH = "../Gemini World 3 QwikLab 2.0.md";

  // Google Docs export escapes punctuation with backslashes (\`, \[, \!, \<, ...).
  // Strip those so markdown renders cleanly.
  function unescapeGdocs(src) {
    return src.replace(/\\([\\`*_{}\[\]()#+\-.!<>|~"'@$%^&=:;,/])/g, "$1");
  }

  function slugify(text) {
    return text.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^\w]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Strip markdown links / author mailto tags from a heading for the nav label.
  function cleanLabel(text) {
    return text.replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").trim();
  }

  let lastRaw = null;

  function render(raw) {
    const cleaned = unescapeGdocs(raw);
    const html = marked.parse(cleaned, { gfm: true, breaks: false });
    const content = document.getElementById("content");
    content.innerHTML = html;

    // Add a clickable copy-to-clipboard button to every code block
    content.querySelectorAll("pre").forEach(pre => {
      const code = pre.querySelector("code");
      if (!code) return;
      const btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.type = "button";
      btn.textContent = "Copy";
      btn.setAttribute("aria-label", "Copy code to clipboard");
      btn.addEventListener("click", async () => {
        const text = code.innerText;
        try {
          await navigator.clipboard.writeText(text);
        } catch (e) {
          // Fallback for non-secure contexts / older browsers
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); } catch (_) {}
          ta.remove();
        }
        btn.textContent = "Copied!";
        btn.classList.add("copied");
        clearTimeout(btn.__t);
        btn.__t = setTimeout(() => {
          btn.textContent = "Copy";
          btn.classList.remove("copied");
        }, 1800);
      });
      pre.appendChild(btn);
    });

    // Missing screenshots -> clean "pending" placeholder instead of a broken-image icon
    content.querySelectorAll("img").forEach(img => {
      img.addEventListener("error", () => {
        const d = document.createElement("div");
        d.className = "img-pending";
        d.textContent = "📷 screenshot pending: " + (img.getAttribute("alt") || img.getAttribute("src"));
        img.replaceWith(d);
      });
    });

    // Flag placeholder callouts so they stand out from real ones
    content.querySelectorAll("blockquote").forEach(bq => {
      const t = bq.textContent || "";
      if (/Presenter note/i.test(t)) bq.classList.add("ph-presenter");
      else if (/SCREENSHOT|DEMO/.test(t)) bq.classList.add("ph-image");
      else if (/TODO:/.test(t)) bq.classList.add("ph-todo");
    });

    // Hero title from first H1
    const firstH1 = content.querySelector("h1");
    if (firstH1) document.getElementById("hero-title").textContent = cleanLabel(firstH1.textContent);

    // Build sidebar from H1s; assign ids for anchoring
    const toc = document.getElementById("toc");
    toc.innerHTML = "";
    const heads = content.querySelectorAll("h1");
    heads.forEach((h, i) => {
      const id = h.id || slugify(h.textContent) || ("sec-" + i);
      h.id = id;
      // Flag empty TODO sections visually
      let label = cleanLabel(h.textContent);
      const a = document.createElement("a");
      a.href = "#" + id;
      a.textContent = label;
      a.dataset.target = id;
      if (/todo/i.test(label)) { a.style.color = "#f0a35e"; }
      toc.appendChild(a);
    });

    setupScrollSpy();
  }

  function setupScrollSpy() {
    const links = [...document.querySelectorAll("#toc a")];
    const map = links.map(a => ({ a, el: document.getElementById(a.dataset.target) })).filter(x => x.el);
    function onScroll() {
      let current = map[0];
      for (const m of map) {
        if (m.el.getBoundingClientRect().top <= 120) current = m;
      }
      links.forEach(a => a.classList.remove("active"));
      if (current) current.a.classList.add("active");
    }
    window.removeEventListener("scroll", window.__spy || (()=>{}));
    window.__spy = onScroll;
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  }

  async function load(initial) {
    try {
      const res = await fetch(encodeURI(MD_PATH) + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const raw = await res.text();
      if (raw !== lastRaw) {
        const y = window.scrollY;
        lastRaw = raw;
        render(raw);
        if (!initial) window.scrollTo(0, y); // preserve scroll on live reload
        blinkDot();
      }
    } catch (e) {
      if (initial) {
        document.getElementById("content").innerHTML =
          '<div id="status">Could not load the markdown.<br><br><code>' + e.message +
          '</code><br><br>Make sure the dev server is running from the project root.</div>';
      }
    }
  }

  function blinkDot() {
    const dot = document.getElementById("dot");
    dot.style.opacity = "0.2";
    setTimeout(() => (dot.style.opacity = "1"), 250);
  }

  // Light/dark theme toggle (persisted; initial value set in the head script)
  const themeToggle = document.getElementById("theme-toggle");
  const themeIcon = document.getElementById("theme-icon");
  function syncThemeIcon() {
    const isDark = document.documentElement.dataset.theme === "dark";
    if (themeIcon) themeIcon.textContent = isDark ? "light_mode" : "dark_mode";
    if (themeToggle) themeToggle.setAttribute("aria-label", isDark ? "Switch to light theme" : "Switch to dark theme");
  }
  syncThemeIcon();
  if (themeToggle) {
    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("theme", next);
      syncThemeIcon();
    });
  }

  // Inline markdown (built/hosted single file) vs. live fetch (local dev)
  const inlineEl = document.getElementById("md-inline");
  const inlineMd = inlineEl ? inlineEl.textContent.trim() : "";
  if (inlineMd) {
    document.getElementById("footer-status").textContent = "Gemini World · Track 3";
    render(inlineMd);
  } else {
    load(true);
    setInterval(() => load(false), 1500); // live reload: poll every 1.5s
  }
</script>
</body>
</html>
